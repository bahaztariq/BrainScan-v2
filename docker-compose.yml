name: brainscan-v2

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://${POSTGRES_USER:-brainscan}:${POSTGRES_PASSWORD:-brainscan}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-nQ0k8yGZ3sT1vXwL5mB7cJ9hP2rF4dA6eU8iO0kMlN2pQ4sT6vX8zB0dF2gH4jK6l}
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__API__HOST: 0.0.0.0
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-brainscan_jwt_secret_change_me}
  AIRFLOW__API_AUTH__JWT_ISSUER: brainscan
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-brainscan-v2}
  BRAINSCAN_HOME: /opt/airflow

x-airflow-service: &airflow-service
  build:
    context: .
    dockerfile: dockerfile
    target: airflow
  image: brainscan-v2/airflow:${AIRFLOW_IMAGE_TAG:-local}
  env_file:
    - path: .env
      required: false
  environment: *airflow-env
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./src:/opt/airflow/src:ro
    - ./src/dags:/opt/airflow/dags:ro
    - ./data:/opt/airflow/data
    - ./models:/opt/airflow/models
    - ./artifacts:/opt/airflow/artifacts
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

x-app-env: &app-env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-brainscan-v2}
  BRAINSCAN_HOME: /app
  CLASSIFICATION_MODEL_PATH: /app/models/classification
  DETECTION_MODEL_PATH: /app/models/detection
  DETECTION_CLASSES: ${DETECTION_CLASSES:-tumour}
  API_BASE_URL: http://api:8000

x-app-service: &app-service
  build:
    context: .
    dockerfile: dockerfile
    target: app
  image: brainscan-v2/app:${APP_IMAGE_TAG:-local}
  env_file:
    - path: .env
      required: false
  environment: *app-env
  user: "${APP_UID:-1000}:0"
  volumes:
    - ./src:/app/src:ro
    - ./data:/app/data
    - ./models:/app/models
    - ./artifacts:/app/artifacts
    - ./logs:/app/logs
  depends_on:
    mlflow:
      condition: service_healthy

services:

  postgres:
    image: postgres:16-alpine
    container_name: brainscan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brainscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainscan}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      MLFLOW_DB_NAME: ${MLFLOW_DB_NAME:-mlflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brainscan} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: dockerfile
      target: app
    image: brainscan-v2/app:${APP_IMAGE_TAG:-local}
    container_name: brainscan-mlflow
    working_dir: /app/artifacts
    user: "${APP_UID:-1000}:0"
    environment:
      MLFLOW_BACKEND_STORE_URI: >-
        postgresql://${POSTGRES_USER:-brainscan}:${POSTGRES_PASSWORD:-brainscan}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
      MLFLOW_ARTIFACTS_DESTINATION: /app/artifacts
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://${POSTGRES_USER:-brainscan}:${POSTGRES_PASSWORD:-brainscan}@postgres:5432/${MLFLOW_DB_NAME:-mlflow}
      - --artifacts-destination
      - /app/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  airflow-init:
    <<: *airflow-service
    container_name: brainscan-airflow-init
    entrypoint: /bin/bash
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    command:
      - -c
      - |
        set -euo pipefail
        mkdir -p /opt/airflow/{logs,dags,plugins,config,models,artifacts,data}
        /entrypoint airflow version
    restart: "no"

  airflow-apiserver:
    <<: *airflow-service
    container_name: brainscan-airflow-apiserver
    command: ["api-server"]
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-service
    container_name: brainscan-airflow-scheduler
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-service
    container_name: brainscan-airflow-dag-processor
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  api:
    <<: *app-service
    container_name: brainscan-api
    command:
      - uvicorn
      - brainscan.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  streamlit:
    <<: *app-service
    container_name: brainscan-streamlit
    command:
      - streamlit
      - run
      - /app/src/brainscan/ui/app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"
      - --browser.gatherUsageStats
      - "false"
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  trainer:
    <<: *app-service
    container_name: brainscan-trainer
    profiles: ["training"]
    command: ["python", "-m", "brainscan.training.run_pipeline"]
    environment:
      <<: *app-env
      DATA_DIR: /app/data
      MODELS_DIR: /app/models
      ARTIFACTS_DIR: /app/artifacts

  airflow-cli:
    <<: *airflow-service
    container_name: brainscan-airflow-cli
    profiles: ["debug"]
    command: ["airflow"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
    name: brainscan-postgres-data
